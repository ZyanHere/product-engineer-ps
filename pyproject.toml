[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "durable-reminders"
version = "0.1.0"
description = "Durable reminders and scheduled follow-ups that stay correct across restarts, retries, edits and cancellation"
requires-python = ">=3.12"

# ---------------------------------------------------------------------------
# Runtime dependencies
#
# One, added at the stage that needed it (docs/STAGES.md, rule 1).
#
# tzdata (Stage 5): `zoneinfo` ships no data of its own -- it borrows the
#   operating system's time-zone database. Windows has none at all, and slim
#   containers usually ship without one, so `ZoneInfo("America/New_York")`
#   raises on somebody else's machine and not on yours. Declared, not assumed.
#
# Coming later:
#   Stage 16  fastapi, pydantic -- when something other than a CLI calls this.
# ---------------------------------------------------------------------------
dependencies = [
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reminders"]

# ---------------------------------------------------------------------------
# pytest
#
# asyncio_mode = "auto" means an `async def test_...` needs no decorator. This
# matters more than it looks: the alternative is a per-test marker that is easy
# to forget, and a forgotten marker makes an async test silently pass without
# ever awaiting anything.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

# ---------------------------------------------------------------------------
# mypy
#
# strict, over src AND tests. Tests are held to the same bar as production code
# because a test that type-checks loosely can assert the wrong thing quietly.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# The design documents contain Python blocks that are illustrative, deliberately
# aligned for reading, and in places not valid standalone code. They are prose,
# not source, and the formatter must leave them alone.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "TID",  # tidy imports -- carries the banned-api rule below
]

# ---------------------------------------------------------------------------
# The real-time ban (docs/STAGES.md, Stage 4)
#
# Stage 4 introduced a clock, so this rule only now has something to guard.
# `src/reminders/clock.py` is the one file allowed to read the wall clock or
# wait on it; everywhere else takes a Clock and is handed the time.
#
# It is not a style preference. One real `sleep` on the polling path makes
# "does a reminder six months out fire?" a test that waits six months, and one
# `datetime.now()` makes a daylight-saving bug in March unreproducible in
# January.
#
# The list only names what the code can actually reach today. `asyncio.sleep`
# and `asyncio.timeout` are not here because nothing in this project uses
# asyncio yet -- they go on the list at the stage that introduces it.
# ---------------------------------------------------------------------------
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.sleep".msg = "Use Clock.sleep()."
"datetime.datetime.now".msg = "Use Clock.now()."
"datetime.datetime.utcnow".msg = "Deprecated, and returns a NAIVE datetime. Use Clock.now()."
"datetime.date.today".msg = "Use Clock.now()."

[tool.ruff.lint.per-file-ignores]
# The one file the ban exists to confine. Nothing else may be added here.
"src/reminders/clock.py" = ["TID251"]
